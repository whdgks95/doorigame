<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두리게임 - 둘이 하는 두뇌 게임</title>
<meta name="description" content="더 지니어스, 피의 게임의 1:1 게임을 친구와 링크 하나로 바로 즐기세요.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/">두리<span>게임</span><small>둘이 하는 두뇌 게임</small></a>
</header>
<div class="home">
  <aside class="sidebar" id="list"></aside>
  <section class="detail" id="detail"></section>
</div>
<div class="toast hide" id="toast"></div>
<script src="/meta.js"></script>
<script>
const list = document.getElementById('list');
const detail = document.getElementById('detail');
// 주소 #흑과백 또는 #blackwhite_plus 로 바로 열기
let hashId = (location.hash || '').slice(1);
let entry = GAME_BY_ID[hashId] || GAMES[0];
let current = entry.base || entry.id;      // 목록에서 고른 기본 게임 id
let mode = entry.isPlus ? 'plus' : 'base';  // 기본 / 심화

function renderList() {
  const shows = [...new Set(GAMES.map(g => g.show))];
  list.innerHTML = shows.map(show => `
    <h3>${show}</h3>
    ${GAMES.filter(g => g.show === show).map(g => `
      <div class="game-item ${g.id === current ? 'active' : ''}" data-id="${g.id}">
        <div class="ic">${g.icon}</div>
        <div><div class="nm">${g.name}${g.plus ? ' <span class="plus-tag">+심화</span>' : ''}</div><div class="tg">${g.time} · 2인</div></div>
      </div>`).join('')}`).join('');
}

function renderDetail() {
  const g = GAME_BY_ID[current];
  const sel = mode === 'plus' && g.plus ? g.plus : g;
  detail.innerHTML = `
    <div class="card">
      <span class="badge">${g.show}</span>
      <h1>${g.icon} ${g.name}${mode === 'plus' && g.plus ? ` <span class="plus-tag big">+심화</span>` : ''}</h1>
      ${g.plus ? `<div class="mode-tabs">
        <button class="${mode === 'base' ? 'on' : ''}" data-mode="base"><b>기본</b><span>${g.name}</span></button>
        <button class="${mode === 'plus' ? 'on' : ''}" data-mode="plus"><b>+심화</b><span>${g.plus.name}</span></button>
      </div>` : ''}
      <div class="sub">${sel.tagline}</div>
      <div class="create-box">
        <button class="primary" id="create">${mode === 'plus' && g.plus ? `+심화 (${g.plus.name}) 친구와 대결` : '친구와 대결 (방 만들기)'}</button>
        <div class="hint">방을 만들면 링크가 생겨요. 링크를 친구에게 보내면 바로 1:1 대결이 시작됩니다.</div>
      </div>
      <div class="create-box bot-box">
        <div class="bot-title">🤖 컴퓨터와 대결 <span class="hint">난이도를 고르면 바로 시작해요</span></div>
        <div class="bot-levels">${BOT_LEVELS.map(([id, nm, desc]) => `<button data-bot="${id}" class="lv-${id}"><b>${nm}</b><span>${desc}</span></button>`).join('')}</div>
      </div>
      <div class="help"><h4 style="color:var(--text);font-size:18px">📖 플레이 방법${mode === 'plus' && g.plus ? ` · ${g.plus.name}` : ''}</h4>${sel.help}</div>
    </div>`;
  document.getElementById('create').onclick = e => createRoom(e, sel.id);
  detail.querySelectorAll('[data-bot]').forEach(btn => (btn.onclick = e => createRoom(e, sel.id, btn.dataset.bot)));
  detail.querySelectorAll('[data-mode]').forEach(b => (b.onclick = () => {
    mode = b.dataset.mode;
    history.replaceState(null, '', '#' + (mode === 'plus' ? g.plus.id : g.id));
    renderDetail();
  }));
}

const BOT_LEVELS = [
  ['easy', '이지', '처음 해보는 분'],
  ['medium', '미디움', '규칙을 아는 수준'],
  ['hard', '하드', '꽤 잘하는 상대'],
  ['insane', '인세인', '고수'],
  ['ai', 'AI', '최강 · 수읽기/확률 계산'],
];
async function createRoom(e, gameId, bot) {
  const btn = e.currentTarget || e.target;
  btn.disabled = true;
  try {
    const res = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gameId, bot }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    location.href = '/r/' + data.roomId;
  } catch (err) {
    toast('방을 만들지 못했어요. 잠시 후 다시 시도해 주세요.');
    btn.disabled = false;
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hide');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hide'), 2500);
}

list.addEventListener('click', e => {
  const item = e.target.closest('.game-item');
  if (!item) return;
  current = item.dataset.id;
  mode = 'base';
  history.replaceState(null, '', '#' + current);
  renderList(); renderDetail();
  if (window.innerWidth < 760) detail.scrollIntoView({ behavior: 'smooth' });
});
renderList(); renderDetail();
</script>
</body>
</html>
